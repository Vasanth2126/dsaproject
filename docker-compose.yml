version: '3.8'

services:
  # Backend API Server
  server:
    build:
      context: ./codesense-ai/server
      dockerfile: Dockerfile
    container_name: codesense-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=change_this_to_a_secure_random_key
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - CLIENT_ORIGIN=http://localhost:5173
    volumes:
      - server_data:/app/data

volumes:
  server_data:
    driver: local
